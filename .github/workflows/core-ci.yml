# =============================================================================
# Nexus Core CI — engineering quality gate for the v2 packages
# =============================================================================
# Enforces lint, format, strict typing, tests + coverage, and build integrity
# for the v2 platform. The legacy v1 `nexus/` package is covered
# separately by `ci.yml`. No deployment steps live here by design.
# =============================================================================

name: Core CI

on:
  push:
    branches: [master, "v*-planning"]
    paths: ['engine-room/**', '.github/workflows/core-ci.yml']
  pull_request:
    branches: [master]
    paths: ['engine-room/**', '.github/workflows/core-ci.yml']

defaults:
  run:
    working-directory: engine-room

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: engine-room/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check nexus_core nexus_infra nexus_planning nexus_context nexus_orchestration nexus_harness nexus_runtime nexus_execution nexus_runtime_claude nexus_runtime_gemini nexus_runtime_shell nexus_runtime_adapters nexus_runtime_llm nexus_validation nexus_recovery nexus_reflection nexus_knowledge nexus_workflows nexus_research nexus_briefings nexus_operator nexus_policy nexus_intent nexus_engineering nexus_estimation nexus_repository nexus_integration nexus_history nexus_human_interaction nexus_approval nexus_operations nexus_scheduler tests/unit/nexus_core tests/unit/nexus_infra tests/unit/nexus_planning tests/unit/nexus_context tests/unit/nexus_orchestration tests/unit/nexus_harness tests/unit/nexus_runtime tests/unit/nexus_execution tests/unit/nexus_runtime_claude tests/unit/nexus_runtime_gemini tests/unit/nexus_runtime_shell tests/unit/nexus_runtime_adapters tests/unit/nexus_validation tests/unit/nexus_recovery tests/unit/nexus_reflection tests/unit/nexus_knowledge tests/unit/nexus_workflows tests/unit/nexus_research tests/unit/nexus_briefings tests/unit/nexus_operator tests/unit/nexus_policy tests/unit/nexus_intent tests/unit/nexus_engineering tests/unit/nexus_estimation tests/unit/nexus_repository tests/unit/nexus_integration tests/unit/nexus_history tests/unit/nexus_human_interaction tests/unit/nexus_approval tests/unit/nexus_operations tests/unit/nexus_scheduler tests/integration
      - name: Ruff format check
        run: uv run ruff format --check nexus_core nexus_infra nexus_planning nexus_context nexus_orchestration nexus_harness nexus_runtime nexus_execution nexus_runtime_claude nexus_runtime_gemini nexus_runtime_shell nexus_runtime_adapters nexus_runtime_llm nexus_validation nexus_recovery nexus_reflection nexus_knowledge nexus_workflows nexus_research nexus_briefings nexus_operator nexus_policy nexus_intent nexus_engineering nexus_estimation nexus_repository nexus_integration nexus_history nexus_human_interaction nexus_approval nexus_operations nexus_scheduler tests/unit/nexus_core tests/unit/nexus_infra tests/unit/nexus_planning tests/unit/nexus_context tests/unit/nexus_orchestration tests/unit/nexus_harness tests/unit/nexus_runtime tests/unit/nexus_execution tests/unit/nexus_runtime_claude tests/unit/nexus_runtime_gemini tests/unit/nexus_runtime_shell tests/unit/nexus_runtime_adapters tests/unit/nexus_validation tests/unit/nexus_recovery tests/unit/nexus_reflection tests/unit/nexus_knowledge tests/unit/nexus_workflows tests/unit/nexus_research tests/unit/nexus_briefings tests/unit/nexus_operator tests/unit/nexus_policy tests/unit/nexus_intent tests/unit/nexus_engineering tests/unit/nexus_estimation tests/unit/nexus_repository tests/unit/nexus_integration tests/unit/nexus_history tests/unit/nexus_human_interaction tests/unit/nexus_approval tests/unit/nexus_operations tests/unit/nexus_scheduler tests/integration

  typecheck:
    name: MyPy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: engine-room/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: MyPy strict
        run: uv run mypy nexus_core nexus_infra nexus_planning nexus_context nexus_orchestration nexus_harness nexus_runtime nexus_execution nexus_runtime_claude nexus_runtime_gemini nexus_runtime_shell nexus_runtime_adapters nexus_runtime_llm nexus_validation nexus_recovery nexus_reflection nexus_knowledge nexus_workflows nexus_research nexus_briefings nexus_operator nexus_human_interaction nexus_approval nexus_operations nexus_scheduler nexus_policy nexus_intent nexus_engineering nexus_estimation nexus_repository nexus_integration nexus_history

  test:
    name: PyTest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: engine-room/uv.lock
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests with coverage gate
        # P17: nexus_policy/intent/engineering/estimation/repository/integration/history/
        # human_interaction/approval/operations/scheduler now run here (lint+mypy+tests), closing
        # the CI-blind-spot finding, but are deliberately NOT in --cov= below: nexus_repository and
        # nexus_scheduler sit under the 95% coverage-fail-under gate today (60% and ~90% on their
        # lowest-covered modules) and closing that honestly needs new tests, not a CI config change.
        run: >
          uv run pytest tests/unit/nexus_core tests/unit/nexus_infra tests/unit/nexus_planning tests/unit/nexus_context tests/unit/nexus_orchestration tests/unit/nexus_harness tests/unit/nexus_runtime tests/unit/nexus_execution tests/unit/nexus_runtime_claude tests/unit/nexus_runtime_gemini tests/unit/nexus_runtime_shell tests/unit/nexus_runtime_adapters tests/unit/nexus_validation tests/unit/nexus_recovery tests/unit/nexus_reflection tests/unit/nexus_knowledge tests/unit/nexus_workflows tests/unit/nexus_research tests/unit/nexus_briefings tests/unit/nexus_operator tests/unit/nexus_policy tests/unit/nexus_intent tests/unit/nexus_engineering tests/unit/nexus_estimation tests/unit/nexus_repository tests/unit/nexus_integration tests/unit/nexus_history tests/unit/nexus_human_interaction tests/unit/nexus_approval tests/unit/nexus_operations tests/unit/nexus_scheduler tests/integration
          --cov=nexus_core
          --cov=nexus_infra
          --cov=nexus_planning
          --cov=nexus_context
          --cov=nexus_orchestration
          --cov=nexus_harness
          --cov=nexus_runtime
          --cov=nexus_execution
          --cov=nexus_runtime_claude
          --cov=nexus_runtime_gemini
          --cov=nexus_runtime_shell
          --cov=nexus_runtime_adapters
          --cov=nexus_validation
          --cov=nexus_recovery
          --cov=nexus_reflection
          --cov=nexus_knowledge
          --cov=nexus_workflows
          --cov=nexus_research
          --cov=nexus_briefings
          --cov=nexus_operator
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=95
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            engine-room/coverage.xml
            engine-room/htmlcov/
          retention-days: 14

  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: engine-room/uv.lock
      - name: Build sdist + wheel
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: engine-room/dist/
          retention-days: 14
